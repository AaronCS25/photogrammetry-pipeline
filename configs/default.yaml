# =============================================================================
# Configuración BASE del pipeline de fotogrametría.
#
# NO editar este archivo para un experimento: crear un YAML en
# configs/experiments/ que sobreescriba solo lo necesario (merge profundo:
# los diccionarios se combinan, escalares y listas se reemplazan).
#
# Referencia completa de parámetros y recetas: docs/configuration.md
# =============================================================================

experiment:
  name: default          # Nombre del experimento => outputs/<escena>/<name>/
  notes: ""              # Notas libres (quedan en config_resolved.yaml)

# Escena a procesar (carpeta bajo datasets/raw/). Normalmente se pasa por CLI
# con --scene, pero puede fijarse aquí.
scene: null

paths:
  raw_root: datasets/raw   # Relativo a la raíz del repo (o ruta absoluta)
  output_root: outputs

# -----------------------------------------------------------------------------
# Etapa 1: extracción de frames con FFmpeg
# -----------------------------------------------------------------------------
frames:
  fps: 2                 # Frames por segundo a extraer del video
  # resize: null => resolución original.
  #   {long_edge: 1920}            => lado mayor a 1920 px, mantiene aspecto (recomendado)
  #   {width: 1080, height: 720}   => encaja dentro de 1080x720 manteniendo aspecto
  resize: null
  format: jpg            # jpg | png
  jpg_quality: 2         # -qscale:v de ffmpeg (1 = mejor calidad ... 31 = peor)
  start: null            # Recortar el video: "00:00:05" para saltar los primeros 5 s
  end: null              # Fin del segmento (timestamp absoluto del video)
  extra_args: []         # Args extra de ffmpeg (lista de strings), se añaden tal cual
  # Fotos sueltas (jpg/png/...) encontradas en la escena:
  #   mode: copy    -> copia preservando EXIF (focal/GPS para COLMAP; recomendado)
  #   mode: symlink -> enlaza sin duplicar disco (también preserva EXIF)
  # Si la fuente tiene `resize`, las fotos se reescalan con ffmpeg y PIERDEN el
  # EXIF; para fotos conviene resize: null y limitar tamaño en COLMAP
  # (feature_extractor.max_image_size y undistort.max_image_size).
  # OJO: todas las fotos de una misma fuente deben tener idénticas dimensiones
  # de píxel (fotos verticales van en su propia subcarpeta).
  photos:
    mode: copy

# Overrides POR FUENTE (subcarpeta de la escena). Cualquier clave de `frames`
# puede sobreescribirse por fuente. Ejemplo:
# sources:
#   drone: {fps: 1.5}
#   phone: {fps: 3, resize: {long_edge: 1600}}
sources: {}

# -----------------------------------------------------------------------------
# Etapa 2: telemetría (opcional) — parsea .srt de DJI junto a cada video
# -----------------------------------------------------------------------------
telemetry:
  enabled: true

# -----------------------------------------------------------------------------
# Etapa 2b: enmascaramiento semántico (opcional, OFF por defecto)
#
# Genera una máscara PNG por frame marcando los píxeles a IGNORAR (personas,
# autos, vegetación...). COLMAP no extrae features ahí (--ImageReader.mask_path)
# y, si apply_to_dense está activo, OpenMVS tampoco densifica esos píxeles.
#
# Requiere el contenedor containers/segmentation.sif (ver containers/README.md).
# La etapa es autónoma: puede ejecutarse sola con
#   apptainer exec --nv containers/segmentation.sif \
#       python3 -m pipeline run --config <cfg> --scene <escena> --stages masks
# -----------------------------------------------------------------------------
masking:
  enabled: false
  # Backend(s) de segmentación — pieza intercambiable (pipeline/mask_backends/).
  # Un nombre o una LISTA para encadenar: las máscaras se fusionan (se ignora
  # todo píxel que cualquier backend ignore). Disponibles:
  #   segformer -> SegFormer-B5 Cityscapes: clases urbanas estándar (rápido)
  #   sam3      -> SAM 3 (Meta): prompts de texto libre; fuerte en estructuras
  #                finas (cables, postes). Requiere pesos gated de HF.
  #   manual    -> PNGs pintados a mano en datasets/raw/<escena>/mask_overrides/
  # Ejemplo de cadena completa: backend: [segformer, sam3, manual]
  backend: segformer
  # Clases a enmascarar (vocabulario del backend; segformer usa Cityscapes):
  #   person rider car truck bus train motorcycle bicycle
  #   vegetation terrain sky pole traffic_light traffic_sign building road ...
  # Nota: 'vegetation' elimina árboles de la reconstrucción pero DEJA HUECOS
  # donde tapaban fachada; los cables NO son segmentables (estructura muy fina),
  # se mitigan con dilate_px y limpieza de malla.
  classes: [person, rider, car, truck, bus, motorcycle, bicycle, sky]
  dilate_px: 15               # margen (px) alrededor de cada objeto enmascarado
  apply_to_dense: false       # pasar máscaras también a DensifyPointCloud (OpenMVS)
  # apply_to_texture: hereda apply_to_dense. Sin máscaras en TextureMesh, los
  # píxeles de un objeto enmascarado (ya sin geometría) se proyectan sobre lo
  # que había detrás ("calcomanías" de autos en el suelo).
  # apply_to_texture: true
  # Override POR FUENTE (merge profundo sobre este bloque): cada subcarpeta de
  # la escena puede usar otra cadena u otra configuración. Caso típico:
  # SegFormer-Cityscapes funciona a nivel de calle pero ALUCINA sobre fachadas
  # en vista aérea oblicua -> el dron usa solo SAM 3 con prompts de objetos.
  # per_source:
  #   drone:
  #     backend: [sam3]
  #     backends:
  #       sam3: {prompts: [car, person, tree, power line, utility pole]}
  per_source: {}
  # Configuración por backend. `classes` y `dilate_px` globales son el default;
  # cada bloque puede sobreescribirlos (p. ej. más dilatación para cables finos).
  backends:
    segformer:
      model_id: nvidia/segformer-b5-finetuned-cityscapes-1024-1024
      inference_size: 1024   # 2048 para fotos aéreas de alta resolución (objetos pequeños)
      # classes: [...]       # opcional: sobreescribe masking.classes solo aquí
      # dilate_px: 15        # opcional: sobreescribe masking.dilate_px solo aquí
    sam3:
      prompts: [power line, electric cable, wire, utility pole]   # sustantivos simples
      score_threshold: 0.5    # confianza mínima por instancia detectada
      checkpoint: null        # ruta local a pesos; null = caché de Hugging Face
      # Mosaico (opcional): SAM 3 trabaja a ~1008 px; en fotos grandes los
      # objetos finos (cables) quedan por debajo de 1 px y no se detectan.
      # tiles: [4, 3] añade una pasada por teselas (4 columnas x 3 filas) que se
      # SUMA a la de la imagen completa. Coste: 1 inferencia extra por tesela.
      tiles: null
      tile_overlap: 0.15      # solape entre teselas (fracción de su tamaño)
      tile_prompts: null      # prompts solo para las teselas; null = los mismos
      # dilate_px: 25        # opcional: los cables agradecen más margen
    manual:
      dir: mask_overrides     # relativo a datasets/raw/<escena>/ (o ruta absoluta)

# -----------------------------------------------------------------------------
# Etapa 3-4: COLMAP (Structure-from-Motion sparse + undistort)
# -----------------------------------------------------------------------------
colmap:
  camera_model: OPENCV           # SIMPLE_RADIAL | RADIAL | OPENCV | OPENCV_FISHEYE ...
  single_camera_per_source: true # Una cámara por subcarpeta (drone/, phone/, ...)

  feature_extractor:
    use_gpu: true
    max_image_size: 2400         # Reescala internamente para extraer features
    max_num_features: 8192
    extra_args: {}               # ej: {SiftExtraction.estimate_affine_shape: 1}

  matcher:
    # Métodos a ejecutar EN ORDEN (los matches se acumulan en la BD):
    #   sequential  -> ideal para video (frames consecutivos)
    #   vocab_tree  -> re-localización global; necesario para unir drone + phone
    #   exhaustive  -> todos contra todos (caro; solo pocas imágenes)
    #   spatial     -> usa prior de posición (requiere GPS en EXIF)
    methods: [sequential]
    use_gpu: true
    sequential_overlap: 10       # nº de frames vecinos a matchear
    loop_detection: false        # requiere vocab_tree_path
    vocab_tree_path: null        # ej: resources/vocab_tree_flickr100K_words256K.bin
    extra_args: {}

  mapper:
    extra_args: {}               # ej: {Mapper.ba_global_function_tolerance: 1e-6}

  undistort:
    max_image_size: -1           # -1 = sin límite

# -----------------------------------------------------------------------------
# Etapa 4b: georreferenciación (opcional, OFF por defecto)
#
# Sin ella el modelo vive en el marco arbitrario de COLMAP (orientación, escala
# y origen sin significado). Con ella: metros reales, eje Z hacia arriba y
# origen en el centro de la escena; opcionalmente una región de interés (ROI)
# para reconstruir solo el objetivo y no los edificios vecinos.
# -----------------------------------------------------------------------------
georef:
  enabled: false
  alignment_type: enu        # enu: GPS del EXIF -> metros, Z arriba | plane: sin GPS, solo endereza
  # Posiciones desde un CSV en vez del EXIF (imágenes sin GPS embebido, p. ej.
  # recortes de Street View): columnas file|name, lat, lon y alt opcional.
  # Ruta relativa a datasets/raw/<escena>/ o absoluta. null = usar el EXIF.
  reference_file: null
  max_error_m: 3.0           # error máximo (m) del ajuste robusto contra el GPS
  min_common_images: 3
  fallback_plane: true       # sin GPS suficiente: enderezar por plano principal (NO métrico)
  center: true               # origen en el centro de la escena (y z=0 ~ suelo)
  center_source: null        # fuente cuyas cámaras definen el centro (ej. drone); null = todas
  ground_below_min_camera_m: 2.0   # el suelo se estima esta distancia bajo la cámara más baja
  roi:                       # recorte: requiere alignment_type enu y center: true
    enabled: false
    radius_m: null           # semilado de la caja en XY; null = distancia horizontal
                             #   mediana cámara->centro (la órbita rodea el objetivo)
    radius_factor: 1.0       # multiplicador del radio automático (0.8 = más ajustado)
    below_m: 3.0             # cuánto incluir por debajo del suelo estimado
    height_m: null           # altura de la caja; null = hasta la cámara más alta

# -----------------------------------------------------------------------------
# Etapa 5: reconstrucción densa
# -----------------------------------------------------------------------------
dense:
  backend: openmvs               # openmvs (recomendado) | colmap (PatchMatch, para comparar)
  colmap:                        # Solo se usa si backend == colmap
    patch_match:
      geom_consistency: true
      max_image_size: -1
      window_radius: 5
      extra_args: {}
    fusion:
      extra_args: {}
    mesher: none                 # none | poisson | delaunay (solo backend colmap)
    mesher_extra_args: {}

# -----------------------------------------------------------------------------
# Etapas 5-7: OpenMVS (densify -> mesh -> refine -> texture)
# -----------------------------------------------------------------------------
openmvs:
  densify:
    resolution_level: 1          # 0 = resolución completa, 1 = mitad, 2 = cuarto...
    number_views: 0              # 0 = usar todas las vistas
    extra_args: {}               # ej: {number-views-fuse: 3}
  mesh:
    enabled: true
    decimate: 1.0                # 1.0 = sin decimación; 0.5 = mitad de caras
    extra_args: {}               # ej: {smooth: 2}
  refine:
    enabled: true
    scales: 2
    extra_args: {}               # ej: {max-face-area: 32}
  texture:
    enabled: true
    export_type: obj             # obj | ply | glb
    extra_args: {}               # ej: {decimate: 0.5}

# -----------------------------------------------------------------------------
# Métricas y runtime
# -----------------------------------------------------------------------------
metrics:
  enabled: true

runtime:
  gpu: true                      # false => todo en CPU (lento; backend colmap denso NO funciona sin GPU)

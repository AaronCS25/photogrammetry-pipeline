# Manzana El Hornero — SOLO TELÉFONO (ablación de fuente).
# 148 fotos 8 MP (3280x2464), horizontales, SIN EXIF (exportadas por una app:
# sin focal, sin GPS; nombres = timestamp de exportación, no orden de captura).
#
# Escena: datasets/raw/hornero_phone/phone/   (hardlinks de hornero/phone)
#   mkdir -p datasets/raw/hornero_phone
#   cp -al datasets/raw/hornero/phone datasets/raw/hornero_phone/phone
#
# Máscaras: SegFormer + SAM 3 (a nivel de calle SegFormer funciona bien:
# verificado con previews en hornero_full_v2).

experiment:
  name: hornero_phone_v1
  notes: "Hornero solo telefono (148 fotos 8MP sin EXIF): exhaustive, SIFT afin+guided, mascaras SegFormer+SAM3, refine completo."

frames:
  resize: null

telemetry:
  enabled: false

masking:
  enabled: true
  backend: [segformer, sam3]
  classes: [person, rider, car, truck, bus, motorcycle, bicycle,
            vegetation, sky, pole, traffic_light, traffic_sign]
  dilate_px: 15
  apply_to_dense: true
  apply_to_texture: true
  backends:
    segformer:
      inference_size: 1024
    sam3:
      prompts: [power line, electric cable, wire, utility pole, lamp post]
      score_threshold: 0.4
      dilate_px: 25

colmap:
  camera_model: OPENCV
  feature_extractor:
    max_image_size: 3200
    max_num_features: 16384
    extra_args:
      SiftExtraction.estimate_affine_shape: 1
      SiftExtraction.domain_size_pooling: 1
      SiftExtraction.num_threads: 8
  matcher:
    methods: [exhaustive]         # 148 fotos = ~10900 pares; el orden de nombres no es fiable
    extra_args:
      SiftMatching.guided_matching: 1
  mapper:
    extra_args:
      Mapper.abs_pose_min_num_inliers: 20
      Mapper.min_num_matches: 10
  undistort:
    max_image_size: 3200

openmvs:
  densify:
    resolution_level: 1
  mesh:
    extra_args:
      remove-spurious: 40
  refine:
    scales: 2

# Manzana El Hornero v2 — mismos datos que hornero_full_v1, tres cambios:
#   1. SegFormer a 2048 px de inferencia: a 1024 un auto visto desde 30 m en
#      una foto de 36 MP mide ~15 px y no se detecta (v1: autos sin enmascarar
#      en las vistas aéreas).
#   2. Máscaras también en TextureMesh (apply_to_texture): en v1 los autos sin
#      geometría se proyectaban como "calcomanías" sobre el suelo.
#   3. SIFT afín + guided matching + mapper más permisivo, para puentear la
#      isla de 50 fotos del teléfono que v1 dejó desconectada (sparse/1).
# v1 queda como referencia: 153/225 registradas, 2 modelos.

experiment:
  name: hornero_full_v2
  notes: "Hornero v2: SegFormer 2048px, mascaras en textura, SIFT afin+guided, mapper permisivo. Ref: v1 153/225 en 2 modelos."

frames:
  resize: null

telemetry:
  enabled: false

masking:
  enabled: true
  backend: [segformer, sam3]
  classes: [person, rider, car, truck, bus, motorcycle, bicycle,
            vegetation, sky, pole, traffic_light, traffic_sign]
  dilate_px: 15
  apply_to_dense: true
  apply_to_texture: true
  backends:
    segformer:
      inference_size: 2048
    sam3:
      prompts: [power line, electric cable, wire, utility pole, lamp post]
      score_threshold: 0.4
      dilate_px: 25

colmap:
  camera_model: OPENCV
  single_camera_per_source: true
  feature_extractor:
    max_image_size: 3200
    max_num_features: 16384
    extra_args:
      SiftExtraction.estimate_affine_shape: 1
      SiftExtraction.domain_size_pooling: 1
      SiftExtraction.num_threads: 8        # extracción afín = CPU; 8 hilos por RAM
  matcher:
    methods: [exhaustive]
    extra_args:
      SiftMatching.guided_matching: 1
  mapper:
    extra_args:
      Mapper.abs_pose_min_num_inliers: 20
      Mapper.min_num_matches: 10
  undistort:
    max_image_size: 3200

openmvs:
  densify:
    resolution_level: 1
  mesh:
    extra_args:
      remove-spurious: 40
  refine:
    scales: 2

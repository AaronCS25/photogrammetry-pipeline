# Manzana desde Google Street View con POCAS vistas por panorama (export de
# barranco-streetview en modo `single` = 1 vista frontal, o `three` = centro +
# conexión anterior/siguiente; FOV 110°, ~10 m entre panoramas). Resultados:
# single 4/36 registradas; three 33/92 (los pares vecinos emparejan bien pero
# casi ningún punto se ve desde 3 posiciones). Pendiente: SfM global / rigs.
#
# Subir SOLO esto del export (el resto, panoramas/ y ubicacion.png, se
# convertiría en fuentes de imágenes espurias):
#   datasets/raw/<escena>/fachadas/*.jpg            -> fuente 'fachadas'
#   datasets/raw/<escena>/fachadas/0/*.jpg          -> también en 'fachadas' (subcarpeta
#                                                      incluida); renombrar a '_0' para excluirla
#   datasets/raw/<escena>/mascaras/fachadas/*.png   -> franja de atribución (backend 'manual')
#   datasets/raw/<escena>/indice.csv                -> lat/lon por panorama (georef)
#   datasets/raw/<escena>/camaras.json              -> intrínsecos exactos (camera_params_file)
#
# Intrínsecos: se leen de camaras.json (camera_params_file), así que sirve para
# cualquier FOV del export. Todas las vistas deben medir 1600x1232.
#
#   ./slurm/submit.sh configs/experiments/streetview_single.yaml <escena>

experiment:
  name: streetview_single_v1
  notes: "Street View, 1 vista frontal por panorama (FOV 110°): PINHOLE fijo, segformer + franja + wires, georef desde indice.csv, clean + inpaint."

frames:
  resize: null

telemetry:
  enabled: false

masking:
  enabled: true
  backend: [segformer, manual, wires]
  classes: [person, rider, car, truck, bus, motorcycle, bicycle, sky, vegetation, pole]
  dilate_px: 10
  apply_to_dense: true
  apply_to_texture: true
  backends:
    manual:
      dir: mascaras
    wires: {}                     # imágenes de 1600 px: trabaja a resolución completa

colmap:
  camera_model: PINHOLE
  feature_extractor:
    max_image_size: 1600
    max_num_features: 16384
    camera_params_file: camaras.json              # fx, fy, cx, cy exactos del export (cualquier FOV)
    extra_args:
      SiftExtraction.estimate_affine_shape: 1     # panoramas a ~10 m: cambio de
      SiftExtraction.domain_size_pooling: 1       # perspectiva grande entre vecinos
      SiftExtraction.num_threads: 8               # afín + DSP en CPU: limitar hilos (OOM)
  matcher:
    methods: [exhaustive]                         # 36 imágenes: trivial
    extra_args:
      SiftMatching.guided_matching: 1
  mapper:
    extra_args:
      Mapper.ba_refine_focal_length: 0            # intrínsecos conocidos: no tocarlos
      Mapper.ba_refine_extra_params: 0
      # Entre panoramas vecinos hay 100-250 inliers, pero casi ningún punto se ve
      # desde TRES posiciones (10 m entre ellas): el registro incremental se
      # corta aunque el emparejamiento sea bueno. Umbrales de registro bajos.
      Mapper.abs_pose_min_num_inliers: 12
      Mapper.abs_pose_min_inlier_ratio: 0.1
      Mapper.min_num_matches: 10

georef:
  enabled: true
  alignment_type: enu
  reference_file: indice.csv
  max_error_m: 5.0                # panoramas de pasadas/fechas distintas: GPS con sesgos propios
  ground_below_min_camera_m: 2.5  # altura aproximada de la cámara de Street View
  roi:
    enabled: false

openmvs:
  densify:
    resolution_level: 0           # imágenes pequeñas: resolución completa
  refine:
    enabled: false                # RefineMesh se quedó colgado >1 h con 22 vistas (job 56800); aporta poco aquí
  clean:
    enabled: true
    min_component: 0.02
    close_holes: 100
    smooth: 2
    decimate: 1.0                 # malla pequeña: no decimar
  texture:
    inpaint: true

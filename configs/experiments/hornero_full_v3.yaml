# Manzana El Hornero v3 — igual que v2 (225/225 registradas) salvo las
# máscaras del DRON.
#
# Diagnóstico de v2 (previews de máscaras): SegFormer-Cityscapes, entrenado a
# nivel de calle, ALUCINA en vista aérea oblicua — enmascaraba en manchones la
# mitad de las fachadas del dron (además de pista y techos). Con las máscaras
# aplicadas en denso y textura, eso dejó huecos y parches en los edificios.
# En el teléfono (nivel de calle) SegFormer funciona bien.
#
# v3: cadena distinta por fuente.
#   phone -> SegFormer + SAM 3 (como v2)
#   drone -> SOLO SAM 3, pidiéndole por texto los objetos a quitar (SAM 3 sí
#            generaliza a vista aérea: contornos limpios de autos y postes)

experiment:
  name: hornero_full_v3
  notes: "Hornero v3: mascaras por fuente (phone SegFormer+SAM3; drone solo SAM3 con prompts de objetos). Ref v2: 225/225 pero fachadas del dron enmascaradas por SegFormer."

frames:
  resize: null

telemetry:
  enabled: false

masking:
  enabled: true
  backend: [segformer, sam3]            # default (teléfono)
  classes: [person, rider, car, truck, bus, motorcycle, bicycle,
            vegetation, sky, pole, traffic_light, traffic_sign]
  dilate_px: 15
  apply_to_dense: true
  apply_to_texture: true
  backends:
    segformer:
      inference_size: 1024              # nivel de calle: su resolución nativa
    sam3:
      prompts: [power line, electric cable, wire, utility pole, lamp post]
      score_threshold: 0.4
      dilate_px: 25
  per_source:
    drone:
      backend: [sam3]
      backends:
        sam3:
          # Objetos, no superficies: nada que pueda confundirse con fachada/techo.
          # Sin "wire"/"cable": en v2 marcaban juntas y ductos de las azoteas.
          prompts: [car, truck, bus, motorcycle, person, tree, utility pole, lamp post, power line]
          score_threshold: 0.5
          dilate_px: 15

colmap:
  camera_model: OPENCV
  single_camera_per_source: true
  feature_extractor:
    max_image_size: 3200
    max_num_features: 16384
    extra_args:
      SiftExtraction.estimate_affine_shape: 1
      SiftExtraction.domain_size_pooling: 1
      SiftExtraction.num_threads: 8
  matcher:
    methods: [exhaustive]
    extra_args:
      SiftMatching.guided_matching: 1
  mapper:
    extra_args:
      Mapper.abs_pose_min_num_inliers: 20
      Mapper.min_num_matches: 10
  undistort:
    max_image_size: 3200

openmvs:
  densify:
    resolution_level: 1
  mesh:
    extra_args:
      remove-spurious: 40
  refine:
    scales: 2

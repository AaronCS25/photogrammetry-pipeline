experiment:
  name: barranco_full_v1
  notes: "Dron (2 cuadras, video 2fps/1920) + telefono (1 cuadra, 534 fotos 16MP); union via vocab_tree."

frames:
  resize: null                    # fotos del telefono intactas (EXIF)

sources:
  drone:
    fps: 2
    resize: {long_edge: 1920}     # el video si se reescala

colmap:
  camera_model: OPENCV
  matcher:
    methods: [sequential, vocab_tree]
    sequential_overlap: 15
    vocab_tree_path: resources/vocab_tree_flickr100K_words256K.bin
  undistort:
    max_image_size: 2400

openmvs:
  densify:
    resolution_level: 1
  mesh:
    decimate: 0.7
  refine:
    scales: 1
    extra_args:
      resolution-level: 2

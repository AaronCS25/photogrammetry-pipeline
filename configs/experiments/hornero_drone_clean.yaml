# Manzana El Hornero — v4: igual que hornero_drone_geo_tiles (georef + ROI +
# SAM 3 con mosaico) más FILTRADO GEOMÉTRICO de los cables que las máscaras no
# atrapan (hilos finos). Un cable que se escapa en 2-3 fotos deja puntos
# aislados en la nube densa; aquí se exige que cada punto lo confirmen 4 vistas
# y se eliminan caras con aristas largas o componentes sueltos en la malla.
#
# Reutiliza máscaras y sparse de v3_tiles (solo repite desde dense, ~25 min):
#   E=outputs/hornero_drone
#   cp -r $E/hornero_drone_v3_tiles $E/hornero_drone_v4_clean
#   rm -rf $E/hornero_drone_v4_clean/{mvs,metrics/metrics.json}
#   ./slurm/submit.sh configs/experiments/hornero_drone_clean.yaml hornero_drone --from-stage dense --force

experiment:
  name: hornero_drone_v4_clean
  notes: "v3_tiles + filtrado geometrico de cables: number-views-fuse 4, remove-spurious 60, smooth 3. Masks y sparse reutilizados de v3_tiles."

frames:
  resize: null

telemetry:
  enabled: false

masking:
  enabled: true
  backend: [sam3]
  dilate_px: 15
  apply_to_dense: true
  apply_to_texture: true
  backends:
    sam3:
      prompts: [car, truck, bus, motorcycle, person, tree, utility pole, lamp post, power line]
      score_threshold: 0.5
      tiles: [6, 4]             # teselas de ~1344x1134 px (+ solape)
      tile_overlap: 0.15
      tile_prompts: [power line, electric cable, wire]

colmap:
  camera_model: OPENCV
  feature_extractor:
    max_image_size: 3200
    max_num_features: 16384
    extra_args:
      SiftExtraction.estimate_affine_shape: 1
      SiftExtraction.domain_size_pooling: 1
      SiftExtraction.num_threads: 8
  matcher:
    methods: [exhaustive]
    extra_args:
      SiftMatching.guided_matching: 1
  mapper:
    extra_args:
      Mapper.abs_pose_min_num_inliers: 20
      Mapper.min_num_matches: 10
  undistort:
    max_image_size: 3200

georef:
  enabled: true
  alignment_type: enu
  max_error_m: 3.0
  roi:
    enabled: true
    radius_m: 32
    below_m: 3.0
    height_m: 25

openmvs:
  densify:
    resolution_level: 1
    extra_args:
      number-views-fuse: 4      # default 3 (verificado en el codigo de OpenMVS 2.3.0): un cable
                                # enmascarado en casi todas las fotos no junta 4 vistas y se descarta
  mesh:
    extra_args:
      remove-spurious: 60       # default 20 (v3: 40): caras largas y componentes sueltos
      smooth: 3                 # default 2
  refine:
    scales: 2
  texture:
    extra_args:
      empty-color: 8421504    # gris 0x808080 en vez del naranja por defecto
      # Cables finos sin enmascarar quedan PINTADOS en la textura de la pared.
      # Una vista cuyo color para una cara se aleja del resto se descarta si su
      # verosimilitud gaussiana es <= este umbral (default 0.06; mayor = mas estricto).
      outlier-threshold: 0.2

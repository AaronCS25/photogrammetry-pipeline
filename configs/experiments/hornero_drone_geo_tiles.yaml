# Manzana El Hornero — solo dron, georef + ROI, y SAM 3 CON MOSAICO para cables.
# Igual que hornero_drone_geo salvo las máscaras: además de la pasada sobre la
# foto completa (autos, personas, árboles, postes: ya funciona bien), SAM 3
# repite la inferencia en 6x4 teselas buscando cables. En la foto completa
# (8064 px -> ~1008 px internos) un cable de 4 px queda en medio píxel y no se
# detecta; en una tesela de ~1350 px queda en ~2.5 px.
#
# Corrida completa desde cero (las máscaras cambian -> cambian sparse y denso):
#   ./slurm/submit.sh configs/experiments/hornero_drone_geo_tiles.yaml hornero_drone

experiment:
  name: hornero_drone_v3_tiles
  notes: "Hornero solo dron + georef/ROI 32 m + SAM3 con mosaico 6x4 para cables (power line, electric cable, wire)."

frames:
  resize: null

telemetry:
  enabled: false

masking:
  enabled: true
  backend: [sam3]
  dilate_px: 15
  apply_to_dense: true
  apply_to_texture: true
  backends:
    sam3:
      prompts: [car, truck, bus, motorcycle, person, tree, utility pole, lamp post, power line]
      score_threshold: 0.5
      tiles: [6, 4]             # teselas de ~1344x1134 px (+ solape)
      tile_overlap: 0.15
      tile_prompts: [power line, electric cable, wire]

colmap:
  camera_model: OPENCV
  feature_extractor:
    max_image_size: 3200
    max_num_features: 16384
    extra_args:
      SiftExtraction.estimate_affine_shape: 1
      SiftExtraction.domain_size_pooling: 1
      SiftExtraction.num_threads: 8
  matcher:
    methods: [exhaustive]
    extra_args:
      SiftMatching.guided_matching: 1
  mapper:
    extra_args:
      Mapper.abs_pose_min_num_inliers: 20
      Mapper.min_num_matches: 10
  undistort:
    max_image_size: 3200

georef:
  enabled: true
  alignment_type: enu
  max_error_m: 3.0
  roi:
    enabled: true
    radius_m: 32
    below_m: 3.0
    height_m: 25

openmvs:
  densify:
    resolution_level: 1
  mesh:
    extra_args:
      remove-spurious: 40
  refine:
    scales: 2
  texture:
    extra_args:
      empty-color: 8421504    # gris 0x808080 en vez del naranja por defecto
